services:
  # ─────────────────────────────────────────────
  # PostgreSQL 14 – Base de datos para Odoo
  # ─────────────────────────────────────────────
  db:
    image: postgres:14
    container_name: odoo_ocr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_secure_pwd_2024
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Odoo 16 – ERP principal
  # ─────────────────────────────────────────────
  odoo:
    image: odoo:16.0
    container_name: odoo_ocr_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo_secure_pwd_2024
    command: ["--limit-time-real=3600", "--limit-time-cpu=3600"]
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    networks:
      - odoo_net

  # ─────────────────────────────────────────────
  # Ollama Local - LLM para OCR en CPU
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: odoo_ocr_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - odoo_net

  # ─────────────────────────────────────────────
  # Microservicio OCR + YOLO (FastAPI)
  # ─────────────────────────────────────────────
  ocr_engine:
    build:
      context: ./ocr_microservice
      dockerfile: Dockerfile
    container_name: odoo_ocr_engine
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=ollama
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL_NAME=minicpm-v
    volumes:
      - ./ocr_microservice/models_ml:/app/models_ml
      # Bind mounts de código fuente para hot-reload (evita rebuild en desarrollo)
      - ./ocr_microservice/validators.py:/app/validators.py:ro
      - ./ocr_microservice/services.py:/app/services.py:ro
      - ./ocr_microservice/main.py:/app/main.py:ro
      - ./ocr_microservice/schemas.py:/app/schemas.py:ro
      - ./ocr_microservice/config.py:/app/config.py:ro
      - ./ocr_microservice/requirements.txt:/app/requirements.txt:ro
    networks:
      - odoo_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # más tiempo para la primera descarga de modelos

volumes:
  odoo_db_data:
  odoo_data:

networks:
  odoo_net:
    driver: bridge
